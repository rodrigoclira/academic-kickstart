# Navigation Links
#   To link a homepage widget, specify the URL as a hash `#` followed by the filename of the
  #     desired widget in your `content/home/` folder.
  #   The weight parameter defines the order that the links will appear in.

main:
  - name: Home
    url: /
    weight: 10
  - name: Publicações
    url: /publications/
    weight: 11
  - name: Palestras
    url: /events/
    weight: 12
  - name: Blog
    url: blog/
    weight: 13
  - name: Projetos
    url: projects/
    weight: 30
  - name: Downloads
    url: downloads/
    weight: 40
  - name: Contato
    url: /#contact
    weight: 50
